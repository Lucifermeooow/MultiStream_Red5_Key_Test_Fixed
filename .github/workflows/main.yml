name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build MultiStream APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: false

      - name: Generate Android project
        run: flutter create --platforms=android .

      - name: Install Android SDK 37
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-37" "platform-tools" "build-tools;36.0.0"

      - name: Upgrade Android Gradle Plugin and Gradle
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          # Upgrade Android Gradle Plugin
          for name in [
              "android/settings.gradle.kts",
              "android/settings.gradle",
              "android/build.gradle.kts",
              "android/build.gradle",
          ]:
              p = Path(name)

              if not p.exists():
                  continue

              s = p.read_text()

              s = s.replace(
                  'com.android.application" version "9.1.0"',
                  'com.android.application" version "9.1.1"'
              )

              s = s.replace(
                  'com.android.library" version "9.1.0"',
                  'com.android.library" version "9.1.1"'
              )

              s = s.replace(
                  "com.android.tools.build:gradle:9.1.0",
                  "com.android.tools.build:gradle:9.1.1"
              )

              p.write_text(s)

          # Upgrade Gradle wrapper
          wrapper = Path(
              "android/gradle/wrapper/gradle-wrapper.properties"
          )

          if wrapper.exists():
              s = wrapper.read_text()

              s = re.sub(
                  r"distributionUrl=.*gradle-[0-9.]+-",
                  "distributionUrl=https\\\\://services.gradle.org/distributions/gradle-9.3.1-",
                  s
              )

              wrapper.write_text(s)

          # Set compileSdk to 37
          for name in [
              "android/app/build.gradle.kts",
              "android/app/build.gradle"
          ]:
              p = Path(name)

              if not p.exists():
                  continue

              s = p.read_text()

              s = s.replace(
                  "compileSdk = flutter.compileSdkVersion",
                  "compileSdk = 37"
              )

              s = s.replace(
                  "compileSdk flutter.compileSdkVersion",
                  "compileSdk 37"
              )

              s = s.replace(
                  "compileSdk = 36",
                  "compileSdk = 37"
              )

              s = s.replace(
                  "compileSdk 36",
                  "compileSdk 37"
              )

              p.write_text(s)
          PY

      - name: Verify Android configuration
        run: |
          echo "===== Android Gradle Plugin ====="
          grep -R "com.android.application" \
            android/settings.gradle* \
            android/build.gradle* || true

          echo "===== compileSdk ====="
          grep -R "compileSdk" \
            android/app/build.gradle* || true

          echo "===== Gradle ====="
          grep "distributionUrl" \
            android/gradle/wrapper/gradle-wrapper.properties

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MultiStream-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
