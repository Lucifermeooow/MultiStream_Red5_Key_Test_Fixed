name: Build MultiStream APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build MultiStream APK
    runs-on: ubuntu-latest

    steps:

      # 1 - تحميل المشروع
      - name: Checkout
        uses: actions/checkout@v4

      # 2 - تثبيت Flutter
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: false

      # 3 - إنشاء ملفات Android
      - name: Generate Android project
        run: |
          flutter create --platforms=android .

      # 4 - تجهيز Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # 5 - تثبيت Android SDK 37
      - name: Install Android SDK 37
        run: |
          sdkmanager "platforms;android-37.0"
          sdkmanager "platform-tools"
          yes | sdkmanager --licenses || true

      # 6 - ضبط compileSdk
      - name: Configure Android
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          # --------------------------------
          # Configure app/build.gradle.kts
          # --------------------------------

          app = Path("android/app/build.gradle.kts")

          if app.exists():

              s = app.read_text()

              s = s.replace(
                  "compileSdk = flutter.compileSdkVersion",
                  "compileSdk = 37"
              )

              s = s.replace(
                  "compileSdk = 36",
                  "compileSdk = 37"
              )

              s = s.replace(
                  "compileSdk = 35",
                  "compileSdk = 37"
              )

              app.write_text(s)

          # --------------------------------
          # Configure Gradle
          # --------------------------------

          wrapper = Path(
              "android/gradle/wrapper/gradle-wrapper.properties"
          )

          if wrapper.exists():

              s = wrapper.read_text()

              s = re.sub(
                  r"gradle-[0-9.]+-",
                  "gradle-9.3.1-",
                  s
              )

              wrapper.write_text(s)

          # --------------------------------
          # Configure Android Gradle Plugin
          # --------------------------------

          for filename in [
              "android/settings.gradle.kts",
              "android/settings.gradle",
              "android/build.gradle.kts",
              "android/build.gradle"
          ]:

              p = Path(filename)

              if not p.exists():
                  continue

              s = p.read_text()

              s = s.replace(
                  'com.android.application" version "9.1.0"',
                  'com.android.application" version "9.1.1"'
              )

              s = s.replace(
                  'com.android.library" version "9.1.0"',
                  'com.android.library" version "9.1.1"'
              )

              s = s.replace(
                  "com.android.tools.build:gradle:9.1.0",
                  "com.android.tools.build:gradle:9.1.1"
              )

              p.write_text(s)

          PY

      # 7 - تنزيل مكتبات Flutter
      - name: Flutter Pub Get
        run: |
          flutter pub get

      # 8 - فحص المشروع
      - name: Flutter Doctor
        run: |
          flutter doctor -v

      # 9 - بناء Debug APK
      - name: Build Debug APK
        run: |
          flutter build apk --debug

      # 10 - رفع APK
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: MultiStream-Debug-APK
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
